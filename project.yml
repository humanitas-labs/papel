name: Paper

options:
  bundleIdPrefix: org.humanitas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: true
    MARKETING_VERSION: 0.7.1
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

targets:
  Paper:
    type: application
    platform: macOS
    sources:
      - path: Paper
        excludes:
          - Resources/paper
          - Resources/enso-wide.png
      - path: Paper/Resources/paper
        buildPhase: resources
      - path: Paper/Resources/enso-wide.png
        buildPhase: resources
    dependencies:
      - sdk: Quartz.framework
    info:
      path: Paper/Resources/Info.plist
      properties:
        CFBundleDisplayName: Paper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Paper
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type:
                - text/markdown
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Paper/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.humanitas.paper
        PRODUCT_NAME: Paper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PaperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PaperTests
    dependencies:
      - target: Paper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: org.humanitas.paper.tests

schemes:
  Paper:
    build:
      targets:
        Paper: all
        PaperTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PaperTests

