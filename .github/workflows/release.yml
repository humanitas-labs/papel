# Builds, signs, notarizes, and publishes a release whenever a v* tag is
# pushed, or on demand for an existing tag. The landing page downloads
# releases/latest/download/Papel.dmg, so publishing here is what puts a
# version in front of visitors.
#
# Repository secrets it needs, set once under Settings ▸ Secrets ▸ Actions:
#
#   MACOS_CERTIFICATE           Developer ID Application certificate, a .p12
#                               export, base64-encoded (base64 -i cert.p12)
#   MACOS_CERTIFICATE_PASSWORD  the password given when exporting the .p12
#   NOTARY_KEY                  the App Store Connect API key (.p8), base64-encoded
#   NOTARY_KEY_ID               its Key ID
#   NOTARY_ISSUER_ID            the team's Issuer ID
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release, such as v0.5.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          [ -n "$MACOS_CERTIFICATE" ] || { echo "MACOS_CERTIFICATE secret is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning | grep -q "Developer ID Application" \
            || { echo "No Developer ID Application identity after import"; exit 1; }

      - name: Build, sign, notarize, and package
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          [ -n "$NOTARY_KEY_BASE64" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] \
            || { echo "NOTARY_KEY, NOTARY_KEY_ID, and NOTARY_ISSUER_ID secrets must all be set"; exit 1; }
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          scripts/make-dmg.sh "${VERSION#v}"
          rm "$NOTARY_KEY"
          cp "dist/Papel-${VERSION#v}.dmg" dist/Papel.dmg

      - name: Release notes from the changelog
        run: |
          set -eu
          awk -v v="${VERSION#v}" '
            /^## / { p = ($2 == v) ; next }
            p' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$VERSION" \
            --title "Papel ${VERSION#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/Papel-${VERSION#v}.dmg" dist/Papel.dmg
